version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: corephp-app
    volumes:
      - .:/var/www/html
    expose:
      - 9000
    depends_on:
      - db   # wait for MySQL to start

  web:
    image: nginx:alpine
    container_name: corephp-web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:5.7
    platform: linux/amd64
    restart: always
    ports:
      - "3388:3306"  # host access if needed
    volumes:
      - ./docker-volumes-data/db:/var/lib/mysql
    environment:
      MYSQL_DATABASE: pam_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user       # optional, better than root
      MYSQL_PASSWORD: password

  phpmyadmin:
    image: phpmyadmin
    platform: linux/amd64
    restart: always
    ports:
      - "8081:80"   # avoid conflict, use 8081
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
